[package]
name = "fumika"
version = "0.1.0"
description = "Fumika - local image, comic and LoRA studio with plugins, ComfyUI included"
authors = ["7err4"]
edition = "2024"
license-file = "../LICENSE"

[lib]
# The `_lib` suffix is needed on Windows so the lib name does not clash with the bin name (cargo#8519)
name = "fumika_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
fs2 = "0.4"
dirs = "6"
anyhow = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.28.0", features = ["v4"] }
rmcp = { version = "3.6", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8.9"
tokio-util = "0.7.20"
base64 = "0.23.1"
crc32fast = "1"   # PNG chunk checksums for the AI-content marking (aimark.rs)
sha2 = "0.10"   # AutoV2 model hashes for the A1111 "parameters" (genparams.rs); already in the tree via tauri
tokio-tungstenite = "0.28"

# the engine archive: 7z portable build on Windows, ComfyUI source + uv tarballs on Linux
[target.'cfg(windows)'.dependencies]
sevenz-rust2 = "0.20"
# the taskbar icon (shell.rs): Tauri sets only the small window icon, Windows then takes the exe icon from its icon cache
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
